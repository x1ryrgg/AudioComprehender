[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    # --- Django / API ---
    "django (>=5.2,<5.3)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-filter (>=26.2,<27.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "nplusone (>=1.0.0,<2.0.0)",

    # --- Celery ---
    "celery (>=5.6.3,<6.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "flower (>=2.2.0,<3.0.0)",

    # --- Анализатор звонков (audio_comprehender) ---
    "pandas (>=3.0.5,<4.0.0)",
    "transformers[torch] (>=5.17.0,<6.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "torchcodec (>=0.16.0,<0.17.0)",
    "soundfile (>=0.14.0,<0.15.0)",
    "torch (>=2.14.0,<3.0.0)",
    "torchaudio (>=2.11.0,<3.0.0)",
    "faster-whisper (>=1.2.1,<2.0.0)",
    "pyannote-audio (>=4.0.7,<5.0.0)",
    "nvidia-cublas-cu12 (>=12.9.2.10,<13.0.0.0)",
    "nvidia-cudnn-cu12 (>=9,<10)",
    "openai (>=3.19.2,<4.0.0)",
    "av (==18.1.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cu130"}
torchaudio = {source = "pytorch-cu130"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.4,<5.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
